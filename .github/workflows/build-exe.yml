name: Build EXE

on:
  push:
    branches:
      - "**"
    paths:
      - "Src/install.ps1"
      - "Src/uninstall.ps1"
      - ".github/workflows/build-exe.yml"
  workflow_run:
    workflows:
      - "Auto Update Config and Install"
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-exe-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref }}

      - name: Install ps2exe module
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe -Force

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('.\\Src\\install.ps1', '.\\Src\\uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$file : $_" }
              exit 1
            }
            Write-Host "$file syntax OK"
          }

      - name: Build install.exe and uninstall.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path .\release -Force | Out-Null

          Invoke-ps2exe .\Src\install.ps1 .\install.exe `
            -noConsole `
            -requireAdmin `
            -iconFile .\Src\icons\install.ico `
            -title "Wallpaper Installer" `
            -description "Installs wallpaper automation"

          Invoke-ps2exe .\Src\uninstall.ps1 .\uninstall.exe `
            -noConsole `
            -iconFile .\Src\icons\uninstall.ico `
            -title "Wallpaper Uninstaller" `
            -description "Uninstalls wallpaper automation"

          Move-Item -Path .\install.exe -Destination .\release\install.exe -Force
          Move-Item -Path .\uninstall.exe -Destination .\release\uninstall.exe -Force

      - name: Commit release EXE files
        shell: pwsh
        env:
          PUBLISH_BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          $branch = $env:PUBLISH_BRANCH
          if (-not $branch) { throw 'Missing branch name' }
          $builtFrom = (git rev-parse HEAD).Trim()
          $sources = @('Src/install.ps1', 'Src/uninstall.ps1', '.github/workflows/build-exe.yml')

          for ($attempt = 1; $attempt -le 5; $attempt++) {
            Write-Host "Publishing to $branch (attempt $attempt/5)"
            git fetch origin "refs/heads/${branch}:refs/remotes/origin/${branch}"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to fetch remote branch' }

            git diff --quiet $builtFrom "origin/$branch" -- $sources
            if ($LASTEXITCODE -eq 1) {
              throw 'Installer source changed during build. Refusing to upload stale binaries; rerun Build EXE.'
            }
            if ($LASTEXITCODE -ne 0) { throw 'Failed to compare source revisions' }

            # Keep the generated EXEs in the working tree, update history and
            # stage only release outputs; do not overwrite unrelated changes.
            git reset --mixed "origin/$branch"
            if ($LASTEXITCODE -ne 0) { throw 'Failed to update local index' }
            git add -f -- release/install.exe release/uninstall.exe
            if ($LASTEXITCODE -ne 0) { throw 'Failed to stage release binaries' }
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'Release files already match the remote branch.'
              exit 0
            }
            if ($LASTEXITCODE -ne 1) { throw 'Failed to compare binaries' }
            git commit -m "ci: update release exe files [skip ci]"
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
            git push origin "HEAD:refs/heads/$branch"
            if ($LASTEXITCODE -eq 0) {
              Write-Host 'Release files pushed.'
              exit 0
            }
            Write-Warning "Remote changed; fetching and retrying..."
            Start-Sleep -Seconds (2 * $attempt)
          }
          throw 'Push rejected after 5 retries'

      - name: Upload EXE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exes-${{ github.ref_name }}-${{ github.sha }}
          path: |
            release/install.exe
            release/uninstall.exe
          if-no-files-found: error
          retention-days: 30
