name: Auto Update Config and Install

on:
  push:
    branches:
      - '**'

jobs:
  update-files:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test repository metadata safety
        run: python3 -m unittest discover -s Tests -p 'test_repo_metadata_security.py' -v

      - name: Sync repository metadata safely
        id: sync
        run: python3 scripts/sync_repo_metadata.py

      - name: Commit and push changes
        run: |
          if git diff --quiet -- Src/config.json Src/install.ps1; then
            echo 'Config and installer are already up to date.'
            exit 0
          fi
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add -- Src/config.json Src/install.ps1
          git commit -m 'ci: synchronize repository metadata [skip ci]'
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"

      - name: Summary
        env:
          CONFIG_UPDATED: ${{ steps.sync.outputs.config-updated }}
          INSTALL_UPDATED: ${{ steps.sync.outputs.install-updated }}
        run: |
          {
            echo '## Update Summary'
            printf 'Repository: %s\n' "$GITHUB_REPOSITORY"
            printf 'Branch: %s\n' "$GITHUB_REF_NAME"
            printf 'Config Updated: %s\n' "$CONFIG_UPDATED"
            printf 'Install Updated: %s\n' "$INSTALL_UPDATED"
          } >> "$GITHUB_STEP_SUMMARY"
